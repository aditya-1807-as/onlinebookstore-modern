<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Asthana Bookstore</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <link rel="stylesheet" href="css/styles.css?v=2.1">
</head>
<body>

    <!-- Floating Navbar -->
    <nav class="app-navbar">
        <a href="index.html" class="brand-wrapper">
            <div class="brand-logo-icon">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: white; width: 1.4rem; height: 1.4rem;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            <span class="brand-title">Asthana Bookstore</span>
        </a>
        <div class="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <!-- Theme Switcher Button -->
            <button class="icon-btn theme-toggle-btn" onclick="ThemeManager.toggle()" title="Toggle Dark/Light Theme">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
        </div>
    </nav>

    <!-- Sign In Card Section -->
    <main class="container" style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 2.5rem 1.5rem;">
        <div class="glass-panel" style="width: 100%; max-width: 460px; padding: 2.5rem; text-align: center;">
            
            <div style="width: 54px; height: 54px; background: rgba(99,102,241,0.15); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; border: 1px solid rgba(99,102,241,0.25);">
                <svg class="svg-icon" viewBox="0 0 24 24" style="width: 1.6rem; height: 1.6rem; color: #818cf8;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            
            <h2 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.4rem;">
                Welcome Back
            </h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.8rem;">
                Sign in to manage orders or access store inventory
            </p>

            <!-- Role Segmented Switcher -->
            <div style="display: flex; background: rgba(0,0,0,0.3); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border-glass); margin-bottom: 1.8rem;">
                <button type="button" id="roleCustomerBtn" class="btn btn-primary" style="flex: 1; padding: 0.6rem; border-radius: 10px; font-size: 0.88rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;" onclick="setLoginRole('customer')">
                    <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Customer</span>
                </button>
                <button type="button" id="roleAdminBtn" class="btn btn-ghost" style="flex: 1; padding: 0.6rem; border-radius: 10px; font-size: 0.88rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;" onclick="setLoginRole('seller')">
                    <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span>Administrator</span>
                </button>
            </div>

            <!-- Quick Demo Credential Pills -->
            <div style="margin-bottom: 1.5rem; text-align: left;">
                <span style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; display: block; margin-bottom: 0.4rem;">
                    Quick 1-Click Demo Fill:
                </span>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.78rem;" onclick="fillCredentials('aditya', 'password123', 'customer')">
                        Aditya (User)
                    </button>
                    <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.78rem;" onclick="fillCredentials('Admin', 'Admin', 'seller')">
                        Admin (Seller)
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <input type="hidden" id="loginRoleInput" value="customer">

                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username or email" required autocomplete="username">
                </div>

                <div class="form-group" style="position: relative;">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" style="padding-right: 2.8rem;">
                        <button type="button" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility" style="position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center;">
                            <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top: 0.5rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <span>Sign In</span>
                    <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-glass); color: var(--text-secondary); font-size: 0.88rem;">
                New to Asthana Bookstore? 
                <a href="register.html" style="color: #a5b4fc; font-weight: 600; text-decoration: none;">Create an account</a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer" style="padding: 1.5rem;">
        <div class="footer-content" style="justify-content: center;">
            <div class="footer-credits">
                Asthana Bookstore Platform • Engineered by <strong>Aditya Asthana</strong>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        function setLoginRole(role) {
            document.getElementById('loginRoleInput').value = role;
            const customerBtn = document.getElementById('roleCustomerBtn');
            const adminBtn = document.getElementById('roleAdminBtn');

            if (role === 'customer') {
                customerBtn.className = 'btn btn-primary';
                adminBtn.className = 'btn btn-ghost';
            } else {
                customerBtn.className = 'btn btn-ghost';
                adminBtn.className = 'btn btn-primary';
            }
        }

        function fillCredentials(user, pass, role) {
            setLoginRole(role);
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            Toast.info(`Filled credentials for ${user}`);
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('loginRoleInput').value;
            const endpoint = role === 'customer' ? 'userlog' : 'adminlog';
            const redirectUrl = role === 'customer' ? 'customer_dashboard.html' : 'admin_dashboard.html';

            await handleFormSubmit(e, endpoint, redirectUrl);
        });
    </script>
</body>
</html>
