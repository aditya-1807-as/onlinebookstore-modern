<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Asthana Bookstore</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="justify-content: space-between;">

    <!-- Floating Navbar -->
    <nav class="app-navbar">
        <a href="index.html" class="brand-wrapper">
            <div class="brand-logo-icon">
                <svg class="svg-icon" viewBox="0 0 24 24" style="color: white; width: 1.4rem; height: 1.4rem;"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            <span class="brand-title">Asthana Bookstore</span>
        </a>
        <div class="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <!-- Theme Switcher Button -->
            <button class="icon-btn theme-toggle-btn" onclick="ThemeManager.toggle()" title="Toggle Dark/Light Theme">
                <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
        </div>
    </nav>

    <!-- Register Card Section -->
    <div class="container" style="display: flex; justify-content: center; align-items: center; padding: 2.5rem 1.5rem;">
        <div class="glass-panel" style="width: 100%; max-width: 620px; padding: 2.5rem;">
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 54px; height: 54px; background: rgba(99,102,241,0.15); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; border: 1px solid rgba(99,102,241,0.25);">
                    <svg class="svg-icon" viewBox="0 0 24 24" style="width: 1.6rem; height: 1.6rem; color: #818cf8;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </div>
                <h2 style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.4rem;">
                    Create Your Account
                </h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Join Asthana Bookstore to order books with instant tracking
                </p>
            </div>

            <!-- Form -->
            <form id="registerForm">
                <div class="grid grid-cols-2" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" name="firstname" class="form-control" placeholder="e.g. John" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" class="form-control" placeholder="e.g. Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mailid">Email Address (This will be your Username)</label>
                    <input type="email" id="mailid" name="mailid" class="form-control" placeholder="e.g. user@example.com" required autocomplete="email">
                </div>

                <div class="grid grid-cols-2" style="margin-bottom: 0;">
                    <div class="form-group">
                        <label for="phone">Phone Number (10 digits)</label>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210" required pattern="[0-9]{10}">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Create strong password" required minlength="4">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Shipping / Delivery Address</label>
                    <textarea id="address" name="address" class="form-control" rows="3" placeholder="Street, City, State, PIN Code" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top: 0.75rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <span>Complete Registration</span>
                    <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div style="margin-top: 1.8rem; padding-top: 1.25rem; border-top: 1px solid var(--border-glass); text-align: center; color: var(--text-secondary); font-size: 0.88rem;">
                Already have an account? 
                <a href="login.html" style="color: #a5b4fc; font-weight: 600; text-decoration: none;">Sign in here</a>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer" style="padding: 1.5rem;">
        <div class="footer-content" style="justify-content: center;">
            <div class="footer-credits">
                Asthana Bookstore Platform • Engineered by <strong>Aditya Asthana</strong>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            if (phone.length < 10) {
                Toast.error("Phone number must have at least 10 digits");
                return;
            }

            await handleFormSubmit(e, 'userreg', 'login.html');
        });
    </script>
</body>
</html>
